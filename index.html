<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eLogističar - Prijava</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/index.css">
</head>
<body>

    <div class="login-kartica">
        <div class="logo-ikona">e</div>
        <h1>eLogističar</h1>
        <p>Unesite podatke za pristup sistemu</p>

        <form id="login-forma">
            <div class="input-grupa">
                <label>Korisničko ime (Ime)</label>
                <input type="text" id="korisnik" placeholder="Unesite ime" required>
            </div>
            <div class="input-grupa">
                <label>Lozinka</label>
                <input type="password" id="sifra" placeholder="Unesite lozinku" required>
            </div>
            <button type="submit">Prijavi se</button>
        </form>

        <div id="poruka-greska"></div>
    </div>

    <script src="/static/index.js"></script>
</body>
</html>

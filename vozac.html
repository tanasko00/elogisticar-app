<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eLogističar - Vozač</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/vozac.css">
</head>
<body>

    <div class="navbar">
        <div class="logo-box">
            <div class="logo-ikona">e</div>
            eLogističar - Vozač
        </div>
        <button class="btn-odjava" onclick="odjaviSe()">Odjavi se</button>
    </div>

    <div class="kontejner">
        <div class="pozdrav">
            <h2>Zdravo, <span id="ime-vozaca">Vozač</span></h2>
            <p>Ovo je pregled dodeljenih vožnji.</p>
        </div>

        <div id="lista-tura">
            <div class="prazno-stanje">Učitavanje tura...</div>
        </div>
    </div>
    <script src="/static/vozac.js"></script>

<div id="chat-kontejner" style="position: fixed; bottom: 20px; right: 20px; width: 320px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; overflow: hidden;">
    <div style="background: #0f172a; padding: 12px; border-bottom: 1px solid #334155; font-weight: 600; color: white;">
        <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleChat()">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span>💬 Chat</span>
                <span id="chat-notifikacija" style="display: none; background: #ef4444; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: bold;">0</span>
            </div>
            <span id="chat-toggle-ikona">▼</span>
        </div>
        <select id="chat-primalac" onchange="promeniChatKanal()" style="width: 100%; margin-top: 8px; padding: 6px; border-radius: 6px; background: #1e293b; color: white; border: 1px solid #334155; outline: none; font-size: 12px; cursor: pointer;">
            <option value="Dispecer">Privatno (Dispečer)</option>
            <option value="Svi">Grupni chat</option>
        </select>
    </div>
    
    <div id="chat-telo" style="display: flex; flex-direction: column; height: 300px;">
        <div id="chat-poruke" style="flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px;"></div>
        
        <div style="padding: 10px; border-top: 1px solid #334155; display: flex; gap: 8px; background: #0f172a;">
            <input type="text" id="chat-unos" placeholder="Unesi poruku..." style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; outline: none;">
            <button onclick="posaljiPoruku()" style="background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600;">Pošalji</button>
        </div>
    </div>
</div>

</body>
</html>
